trigger: none

pool:
  vmImage: ubuntu-latest

steps:
- task: AzureCLI@2
  inputs:
    azureSubscription: 'Az-Sc_devops'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -e

      echo "=== Starting Azure VM Deployment ==="

      RG_NAME="DevopsLearning-rg"
      LOCATION="francecentral"
      VM_NAME="slazbuildVM03"
      ADMIN_USER="azureuser"
      ADMIN_PASS="$VM_ADMIN_PASSWORD"

      VNET_NAME="TestVnet"
      SUBNET_NAME="TestSubnet"
      ADDRESS_SPACE="10.0.0.0/16"
      SUBNET_PREFIX="10.0.1.0/24"

      NSG_NAME="Devops_nsg"
      PUBLIC_IP_NAME="devopslearning-pip01"
      NIC_NAME="Learning_NIC"

      STORAGE_NAME="varanasilsa$RANDOM"

      echo "=== Creating Resource Group ==="
      az group create --name $RG_NAME --location $LOCATION

      echo "=== Creating Storage Account ==="
      az storage account create \
        --name $STORAGE_NAME \
        --resource-group $RG_NAME \
        --location $LOCATION \
        --sku Standard_LRS \
        --kind StorageV2 \
        --https-only true \
        --min-tls-version TLS1_2

      echo "=== Creating Virtual Network ==="
      az network vnet create \
        --resource-group $RG_NAME \
        --name $VNET_NAME \
        --address-prefix $ADDRESS_SPACE \
        --subnet-name $SUBNET_NAME \
        --subnet-prefix $SUBNET_PREFIX

      echo "=== Creating NSG (no custom rules) ==="
      az network nsg create \
        --resource-group $RG_NAME \
        --name $NSG_NAME

      echo "=== Creating Public IP (Standard, Static) ==="
      az network public-ip create \
        --resource-group $RG_NAME \
        --name $PUBLIC_IP_NAME \
        --sku Standard \
        --allocation-method Static

      echo "=== Creating NIC ==="
      az network nic create \
        --resource-group $RG_NAME \
        --name $NIC_NAME \
        --vnet-name $VNET_NAME \
        --subnet $SUBNET_NAME \
        --network-security-group $NSG_NAME \
        --public-ip-address $PUBLIC_IP_NAME

      echo "=== Validating VM password presence ==="
      if [ -z "$ADMIN_PASS" ]; then
        echo "ERROR: VM_ADMIN_PASSWORD is empty or not set in pipeline variables."
        exit 1
      fi

      echo "=== Creating Linux VM ==="
      az vm create \
        --resource-group $RG_NAME \
        --name $VM_NAME \
        --nics $NIC_NAME \
        --image Ubuntu2204 \
        --admin-username $ADMIN_USER \
        --admin-password "$ADMIN_PASS" \
        --authentication-type password \
        --size Standard_B4ms \
        --boot-diagnostics-storage $STORAGE_NAME \
        --location $LOCATION

      echo "=== VM Deployment Completed Successfully ==="

  env:
    VM_ADMIN_PASSWORD: $(VM_ADMIN_PASSWORD)